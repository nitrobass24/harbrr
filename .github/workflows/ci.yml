name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "website/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "website/**"
      - "**/*.md"
  # Manual release fallback: dispatch this workflow against a `v*` tag to (re)run a
  # release without re-tagging — goreleaser and the docker publish treat a dispatch
  # aimed at a tag exactly like the tag push. Dispatching against a branch just runs CI.
  workflow_dispatch:

permissions:
  contents: read

env:
  # A stalled cache-blob download (0 MB/s mid-transfer, seen from the self-hosted
  # fleet) otherwise hangs for actions/cache's default 10-minute segment timeout
  # before falling back to a miss. Give up after 2 and take the miss.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"

# Cancel superseded runs on a PR branch; never cancel main-branch history.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The repo's cheap PR-only tripwires, collected in one fast job off the critical
  # path (was `vendor-guard`, renamed when it outgrew its founding check).
  # First among them: block hand-edits to the vendored Jackett snapshot
  # (internal/indexer/definitions/vendor/**), which is consumed byte-for-byte — the
  # authoritative, non-bypassable enforcement of AGENTS.md's #1 rule; a contributor
  # using any editor/agent is caught here, unlike the local pre-commit / editor
  # hooks. The scheduled refresh branch (chore/vendor-definitions) is exempt inside
  # the script. The remaining steps guard version-pin agreement: go.mod is the ONLY
  # place the Go version is written, but a container image tag must be resolvable
  # before any step runs and so cannot read it — pins are checked after the fact
  # here instead.
  guards:
    name: guards
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Guard vendored definitions
        run: scripts/check-vendor-untouched.sh --ci
      # backend-test's container tag is pinned (it must be resolvable before the job
      # starts), so a go.mod bump that forgets it would otherwise surface as a
      # confusing GOTOOLCHAIN failure inside every shard. Catch it here instead —
      # this job runs in parallel and gates nothing.
      - name: go.mod matches backend-test's pinned container
        run: |
          want=$(awk '/^go /{print $2; exit}' go.mod)
          # Anchored at the start of the line so this guard does not match its own
          # source, which necessarily contains the same literal text.
          got=$(grep -E '^[[:space:]]*image: golang:' .github/workflows/ci.yml \
                | head -1 | sed -E 's/.*golang:(.*)-alpine.*/\1/')
          if [ "$want" != "$got" ]; then
            echo "go.mod requires go $want but backend-test pins golang:$got-alpine" >&2
            echo "Update the 'image:' line under jobs.backend-test.container in .github/workflows/ci.yml" >&2
            exit 1
          fi
          echo "backend-test container pin matches go.mod: $want"
      # Same idea for bun: web/package.json's packageManager field is the single
      # source of truth, repeated as oven/bun container tags (ci.yml, docs.yml)
      # and web-e2e's `npm install -g bun@...`. A bump that misses one reference
      # would silently run CI on mismatched bun versions — catch it here instead.
      - name: workflows' bun pins match web/package.json
        run: |
          want=$(sed -nE 's/.*"packageManager": *"bun@([^"]+)".*/\1/p' web/package.json)
          if [ -z "$want" ]; then
            echo 'web/package.json has no packageManager bun pin' >&2
            exit 1
          fi
          # image: lines anchored at line start so this guard does not match its
          # own source (the golang guard's trick); the install-line pattern only
          # matches bun@<digit>, which this script never contains.
          stale=$(grep -rnE '^[[:space:]]*image: oven/bun:|bun@[0-9][0-9.]*' .github/workflows/ \
                  | grep -vE "oven/bun:${want}-alpine|bun@${want}") || true
          if [ -n "$stale" ]; then
            echo "bun references out of sync with web/package.json's bun@${want}:" >&2
            echo "$stale" >&2
            exit 1
          fi
          echo "all workflow bun pins match web/package.json: bun@${want}"
      # The Dockerfile's build stage and vendor-definitions.yml pin Go at the minor
      # level, and Dependabot's docker ecosystem can bump the Dockerfile AHEAD of
      # go.mod — the reverse drift direction from the check above, and invisible to
      # CI because the docker job injects a host-built binary and never runs that
      # stage. The Dockerfile also pins alpine twice (rootfs + final) and copies
      # passwd/group between them, so those two must stay identical.
      - name: Dockerfile / workflow Go and alpine pins agree
        run: |
          want=$(awk '/^go /{print $2; exit}' go.mod)
          # FROM/image: anchors keep this from matching its own source (the same
          # trick as the check above). A minor-level pin (1.27) is satisfied by a
          # go.mod inside that minor (1.27.x); an exact pin must match exactly.
          for got in $(grep -hE '^FROM .*golang:' Dockerfile \
                       | sed -E 's/.*golang:([0-9.]+)-alpine.*/\1/') \
                     $(grep -hE '^[[:space:]]*image: golang:' .github/workflows/*.yml \
                       | sed -E 's/.*golang:([0-9.]+)-alpine.*/\1/'); do
            case "$want" in
              "$got"|"$got".*) ;;
              *)
                echo "go.mod requires go $want but a golang:$got-alpine pin exists in the Dockerfile or a workflow" >&2
                exit 1
                ;;
            esac
          done
          alpines=$(grep -hE '^FROM .*alpine:[0-9]' Dockerfile \
                    | sed -E 's/.*alpine:([0-9.]+).*/\1/' | sort -u)
          if [ -z "$alpines" ] || [ "$(echo "$alpines" | wc -l)" -ne 1 ]; then
            echo "Dockerfile alpine base pins are missing or disagree:" >&2
            grep -nE '^FROM .*alpine:[0-9]' Dockerfile >&2 || true
            exit 1
          fi
          echo "golang pins agree with go.mod ($want); Dockerfile alpine pins agree ($alpines)"

  # `go test` compiles every package (and test file) before running, so it doubles as
  # the compile check. The race suite is split into package shards because the full
  # single-job run is CI's long pole; every shard still runs with -race -count=1.
  # Cross-build below covers other platforms and vet is covered by golangci-lint (govet).
  backend-test:
    name: backend-test (${{ matrix.shard.name }})
    runs-on: self-hosted
    # Match the Dockerfile's build stage (golang:1.27-alpine) so the toolchain that
    # tests is the image's own musl Go — hence no actions/setup-go here (it would
    # download a glibc Go and shadow the image's on PATH, silently defeating the
    # point) and GOTOOLCHAIN=local (so a go.mod toolchain bump fails loud instead of
    # fetching a glibc Go behind our back). GitHub Actions injects its own
    # glibc-linked Node runtime into container jobs to run JS-based actions
    # (checkout, cache); a bare Alpine container is musl-only and that Node binary
    # fails immediately on the first action step — `gcompat` shims the missing glibc
    # symbols and must be installed before any other step. `build-base` (gcc +
    # musl-dev) is required because `go test -race` always needs cgo, unlike the
    # Dockerfile's CGO_ENABLED=0 product build.
    container:
      # Pinned to go.mod's exact patch — NOT the floating 1.27-alpine, which lagged
      # go.mod once already and silently poisoned the lint cache. This used to be
      # derived at runtime by a `go-version` job, but a container image tag has to be
      # known before the job starts, so that job could only ever be a separate node in
      # the graph — and it put a dependency edge, and therefore a runner dispatch wait
      # (observed at up to 56s), in front of every shard. Drift is caught twice
      # instead: `guards` compares this pin against go.mod off the critical path,
      # and GOTOOLCHAIN=local below makes `go list -m` refuse to run at all if the
      # container's Go is older than go.mod asks for.
      image: golang:1.27.0-alpine
      # Persistent host-disk Go caches instead of actions/cache: the self-hosted
      # fleet shares one host, so round-tripping ~2GB of cache blobs through GHA
      # storage cost ~40s of restore per shard (plus the stalled-segment-download
      # failure mode) to land bytes on a disk they never left. The module cache is
      # shared across shards (content-addressed, concurrency-safe via its own lock
      # files); the build cache stays per-shard, matching the old per-shard keys.
      volumes:
        - /mnt/optane/github-actions/harbrr-go-cache/mod:/home/ci/go/pkg/mod
        - /mnt/optane/github-actions/harbrr-go-cache/build-${{ matrix.shard.name }}:/home/ci/.cache/go-build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: cardigann
            packages: ./internal/indexer/cardigann/...
          - name: state-api
            packages: ./internal/appsync/... ./internal/auth/... ./internal/database/... ./internal/indexer/registry/... ./internal/web/api/...
          - name: rest
            packages: $(go list ./... | grep -Ev '/internal/indexer/cardigann(/|$)|/internal/(appsync|auth|database)(/|$)|/internal/indexer/registry(/|$)|/internal/web/api(/|$)')
    env:
      CGO_ENABLED: "1"
      GOTOOLCHAIN: local
      # In a container job the workspace bind-mount is owned by the host runner's
      # uid, not the step's user, so git refuses it (safe.directory) and go's VCS
      # stamping dies with exit 128 on every go list/test of a main package. Tests
      # and package listings don't need VCS stamps — disable them outright.
      GOFLAGS: -buildvcs=false
      # Owned by the non-root `ci` user the tests run as (see the test step).
      GOMODCACHE: /home/ci/go/pkg/mod
      GOCACHE: /home/ci/.cache/go-build
    steps:
      - name: install container prerequisites (gcompat for GHA's Node runtime, git for checkout/go mod, build-base for -race's cgo requirement, ruby for the shard-coverage guard)
        run: |
          apk add --no-cache gcompat git build-base ruby
          adduser -D ci
          # The shared caches must only ever be written by uid 1000 (`ci` is the
          # first user every fresh container creates): the three shards mount the
          # same module cache concurrently, so a root-owned file written by one
          # job breaks another job's ci-user reads mid-run. chown the mounts up
          # front and keep every go invocation that can write to them (the shard
          # guard, the tests) on the ci user.
          chown -R ci: /home/ci
      # No git ops after checkout, and the tests below run as the less-trusted `ci`
      # user — don't leave the GITHUB_TOKEN readable in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same toolchain assertion as the golangci-lint job: with GOTOOLCHAIN=local an
      # image older than go.mod's requirement cannot load packages, and this fails loud
      # here rather than surfacing as a confusing downstream error. As ci for the same
      # single-writer-uid reason as the guard: even a read-mostly go command may
      # initialize cache directories.
      - name: assert the container Go satisfies go.mod
        run: su ci -s /bin/sh -c "PATH='$PATH' HOME=/home/ci GOTOOLCHAIN=local GOFLAGS=-buildvcs=false GOMODCACHE=/home/ci/go/pkg/mod GOCACHE=/home/ci/.cache/go-build sh -c 'cd $PWD && go version && go list -m'"
      # Runs as ci (not root): its `go list` downloads modules into the shared
      # mounted cache, and only uid 1000 may ever write there (see prerequisites).
      - name: guard shard package coverage
        if: matrix.shard.name == 'rest'
        run: |
          cat > /tmp/shard-guard.sh <<'SCRIPT'
          set -eu
          export HOME=/home/ci GOTOOLCHAIN=local GOFLAGS=-buildvcs=false GOMODCACHE=/home/ci/go/pkg/mod GOCACHE=/home/ci/.cache/go-build
          cd "$1"
          ruby -ryaml -e 'YAML.load_file(".github/workflows/ci.yml").fetch("jobs").fetch("backend-test").fetch("strategy").fetch("matrix").fetch("shard").each { |s| puts "#{s.fetch("name")}\t#{s.fetch("packages")}" }' |
            while IFS="$(printf '\t')" read -r shard packages; do
              echo "expanding ${shard}" >&2
              eval "go list ${packages}"
            done |
            sort -u > /tmp/backend-shard-packages.txt
          go list ./... | sort -u > /tmp/backend-all-packages.txt
          diff -u /tmp/backend-all-packages.txt /tmp/backend-shard-packages.txt
          SCRIPT
          su ci -s /bin/sh -c "PATH='$PATH' /bin/sh /tmp/shard-guard.sh '$PWD'"
      # Run as a non-root user: container jobs default to root, and root bypasses
      # file permissions — internal/secrets' fail-closed keyring test (unreadable
      # key_file must be fatal, never a plaintext fallback) t.Skips as root, which
      # would silently drop the suite's security coverage. The command goes through
      # a script file so the rest shard's $(go list ...) packages expression expands
      # in the ci user's shell with ci's Go env (busybox su also resets PATH/HOME,
      # so PATH is handed through explicitly).
      - name: test (race, non-root)
        run: |
          cat > /tmp/shard-test.sh <<'SCRIPT'
          set -eu
          export HOME=/home/ci CGO_ENABLED=1 GOTOOLCHAIN=local GOFLAGS=-buildvcs=false GOMODCACHE=/home/ci/go/pkg/mod GOCACHE=/home/ci/.cache/go-build
          cd "$1"
          go test -race -count=1 ${{ matrix.shard.packages }}
          SCRIPT
          su ci -s /bin/sh -c "PATH='$PATH' /bin/sh /tmp/shard-test.sh '$PWD'"

  # Frontend checks — tsc type-check, ESLint (type-aware rules via typescript-eslint
  # recommendedTypeChecked), and the Vitest suite in one job. Each check was its own
  # job, but the real work (~40s total) was dwarfed by tripling the container/checkout/
  # install scaffolding (~20s per job), so one job is cheaper in machine time and no
  # slower in wall time (this chain sits well off the run's critical path).
  web-checks:
    name: web-checks
    runs-on: self-hosted
    container:
      image: oven/bun:1.4.0-alpine
      # Host-disk bun package cache, shared by every frontend job (concurrent
      # installs are safe — the cache is content-addressed and lock-protected).
      # All frontend jobs run as root, so the cache has a single writer uid.
      volumes:
        - /mnt/optane/github-actions/harbrr-bun-cache:/bun-cache
        # ESLint result cache. Type-aware rules build the whole TS program, which is
        # most of that step; caching it skips every file whose contents are unchanged.
        - /mnt/optane/github-actions/harbrr-eslint-cache:/eslint-cache
    timeout-minutes: 10
    env:
      BUN_INSTALL_CACHE_DIR: /bun-cache
    steps:
      - name: install container prerequisites
        run: apk add --no-cache gcompat git libatomic
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install
        working-directory: web
        run: bun install --frozen-lockfile
      # `tsc -b` (project references; noEmit already set in tsconfig.app.json).
      - name: typecheck
        working-directory: web
        run: bun run typecheck
      # One cache file per branch: .eslintcache is a single unlocked JSON blob, so a
      # shared path would let concurrent branches clobber each other's. Slashes in the
      # branch name become underscores so the result is a valid filename.
      - name: lint
        working-directory: web
        run: bun run lint -- --cache-location "/eslint-cache/$(echo "$GITHUB_REF_NAME" | tr / _).json"
      - name: test
        working-directory: web
        run: bun run test

  # Production build of the SPA (web/). The dist bundle is uploaded as an artifact and
  # every binary-producing job (cross-build, docker, goreleaser) downloads it instead of
  # rebuilding, so all shipped binaries embed the identical bundle.
  web:
    name: web
    runs-on: self-hosted
    container:
      image: oven/bun:1.4.0-alpine
      # Host-disk bun cache — see web-checks. This job heads the run's critical
      # path (web -> web-e2e / docker -> docker-merge), so its install time is
      # wall-clock for the whole run.
      volumes:
        - /mnt/optane/github-actions/harbrr-bun-cache:/bun-cache
        # Built bundles, keyed by the hash of everything that can change one. Most
        # PRs here are backend-only, and this job heads the critical path.
        - /mnt/optane/github-actions/harbrr-web-dist:/web-dist-cache
    timeout-minutes: 10
    env:
      BUN_INSTALL_CACHE_DIR: /bun-cache
    steps:
      - name: install container prerequisites
        run: apk add --no-cache bash gcompat git libatomic
      # read-only git ops (the route-tree drift check) after checkout, so don't persist the token in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The bundle is a pure function of the tracked web sources plus the OpenAPI
      # spec the api-types drift check regenerates from — so hash exactly those and
      # nothing else. `git ls-files -s` prints each path's blob hash, so the key is
      # content-addressed without reading a single file.
      - name: compute bundle cache key
        id: bundle
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          key=$(git -C "$GITHUB_WORKSPACE" ls-files -s web internal/web/swagger/openapi.yaml | sha256sum | cut -d' ' -f1)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "bundle cache key: $key"
      # Exact match only — no restore-keys fallback. A near-miss here would ship a
      # stale UI inside the release image, which is far worse than rebuilding.
      - name: restore cached bundle
        id: restore
        run: |
          src="/web-dist-cache/${{ steps.bundle.outputs.key }}"
          if [ -d "$src" ]; then
            mkdir -p web/dist && cp -a "$src/." web/dist/
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "bundle cache HIT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "bundle cache MISS"
          fi
      - name: install
        if: steps.restore.outputs.hit != 'true'
        working-directory: web
        run: bun install --frozen-lockfile
      # The route tree is generated from src/routes and committed; a contributor
      # who adds a route but forgets `bun run generate:routes` fails here, not in a
      # teammate's surprise diff later.
      - name: route-tree drift check
        if: steps.restore.outputs.hit != 'true'
        working-directory: web
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bun run generate:routes
          git -C "$GITHUB_WORKSPACE" diff --exit-code -- web/src/routeTree.gen.ts
      # The API types are generated from internal/web/swagger/openapi.yaml and
      # committed; a contributor who changes the spec but forgets `bun run generate:api`
      # fails here, not in a teammate's surprise diff later.
      - name: api-types drift check
        if: steps.restore.outputs.hit != 'true'
        working-directory: web
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bun run generate:api
          # A PR that DELETES api.gen.ts regenerates it as an untracked file, and
          # `git diff --exit-code` ignores untracked paths — so the diff below would
          # pass with no generated file committed at all. Assert it is tracked first.
          if ! git -C "$GITHUB_WORKSPACE" ls-files --error-unmatch web/src/types/api.gen.ts >/dev/null 2>&1; then
            echo "::error::web/src/types/api.gen.ts is not tracked. It is generated from internal/web/swagger/openapi.yaml and must be committed — run 'bun run generate:api' in web/ and commit it."
            exit 1
          fi
          if ! git -C "$GITHUB_WORKSPACE" diff --exit-code -- web/src/types/api.gen.ts; then
            echo "::error::web/src/types/api.gen.ts is stale. An internal/web/swagger/openapi.yaml edit is a WEB change: run 'bun run generate:api' in web/ and commit web/src/types/api.gen.ts. Note make test-openapi does NOT catch this — it compares method/path sets only. The pre-commit hook openapi-types-synced checks this locally."
            exit 1
          fi
      - name: build
        if: steps.restore.outputs.hit != 'true'
        working-directory: web
        run: bun run build:bundle
      # Guard runs on both paths: a cache hit must clear the same bar as a fresh
      # build, or a bad bundle would be cached once and served forever.
      - name: guard the bundle
        run: scripts/check-web-dist.sh
      - name: save bundle to cache
        if: steps.restore.outputs.hit != 'true'
        run: |
          dst="/web-dist-cache/${{ steps.bundle.outputs.key }}"
          rm -rf "$dst.tmp" && mkdir -p "$dst.tmp"
          cp -a web/dist/. "$dst.tmp/"
          # Rename is atomic on the same filesystem, so a concurrent job never sees
          # a half-copied bundle under the real key.
          rm -rf "$dst" && mv "$dst.tmp" "$dst"
      - name: upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  # Playwright e2e: compiles the real binary around the web job's tested bundle,
  # boots it against a fresh data dir, and drives the first-run auth flow in a
  # real browser (web/e2e/). The Playwright image ships the matching browsers —
  # keep its tag in sync with web/package.json's @playwright/test version, or
  # playwright aborts with "Executable doesn't exist". The tag is pinned to the
  # multi-arch index digest — re-resolve the digest whenever the tag moves.
  web-e2e:
    name: web-e2e
    runs-on: self-hosted
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      # Host-disk Go caches, same rationale as backend-test: this job sits on the
      # run's critical path (web -> web-e2e -> docker-merge), and the actions/cache
      # pair it replaced spent ~30s SAVING at job end plus a cold `go build` (~28s)
      # on every miss. Kept separate from backend-test's dirs: this container runs
      # as root, backend-test's caches are uid-1000, and mixing writer uids in one
      # cache is the exact breakage the single-writer rule exists to prevent.
      volumes:
        - /mnt/optane/github-actions/harbrr-go-cache/e2e-mod:/root/go/pkg/mod
        - /mnt/optane/github-actions/harbrr-go-cache/e2e-build:/root/.cache/go-build
        - /mnt/optane/github-actions/harbrr-bun-cache:/bun-cache
    timeout-minutes: 15
    needs: [web]
    env:
      # Workspace bind-mount is owned by the host runner's uid, so go's VCS
      # stamping dies on safe.directory (see backend-test); e2e needs no stamp.
      GOFLAGS: -buildvcs=false
      GOMODCACHE: /root/go/pkg/mod
      GOCACHE: /root/.cache/go-build
      # Host-disk bun cache (shared by every frontend job; see web-checks).
      BUN_INSTALL_CACHE_DIR: /bun-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Single source of truth (autobrr/qui's pattern): setup-go reads the
          # version straight from go.mod, so a bump there needs no CI edit.
          go-version-file: go.mod
          # Go caches are host bind-mounts (see the container block).
          cache: false
      # The Playwright image ships node, not bun. The npm wrapper package is the
      # cheapest way in — it just fetches the pinned bun binary (no build step).
      - name: install bun
        run: npm install -g bun@1.4.0
      - name: install
        working-directory: web
        run: bun install --frozen-lockfile
      - name: download web dist (built once by the web job)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist
      - name: guard the bundle
        run: scripts/check-web-dist.sh
      - name: build binary (embeds the downloaded bundle)
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o bin/harbrr ./cmd/harbrr
      - name: e2e
        working-directory: web
        run: bun run test:e2e
      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  golangci-lint:
    name: golangci-lint
    runs-on: self-hosted
    # Host job, not a container: linting has no permission-gated tests (unlike
    # backend-test, which needs a non-root user), and the product binary is
    # CGO_ENABLED=0, so nothing it lints links libc — the musl toolchain the Alpine
    # image provided bought nothing here. setup-go installs exactly what go.mod asks
    # for, so the image-vs-go.mod desync that once poisoned this job's cache cannot
    # recur: there is no image tag left to drift.
    timeout-minutes: 10
    steps:
      # Linting runs no git operations of its own after checkout, so don't leave the
      # GITHUB_TOKEN readable in .git/config — same posture as every other job here.
      # only-new-issues is unaffected: golangci-lint-action reads the base diff through
      # the API with its own token, not through the persisted git credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Single source of truth (autobrr/qui's pattern): setup-go reads the
          # version straight from go.mod, so a bump there needs no CI edit.
          go-version-file: go.mod
          # Host job on the shared persistent self-hosted fleet: GOMODCACHE/GOCACHE
          # already persist in /root between runs, so a GHA cache round-trip is pure
          # overhead. Container jobs that need caching (backend-test) use actions/cache.
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        env:
          # Same reasoning as setup-go's `cache: false` directly above, applied to
          # the analysis cache the action manages for itself. Measured on
          # dba00e5: restoring it took 44.5s and saving it 10.1s, wrapping a lint
          # that itself ran in 24.5s — the payload is only ~20MB but tens of
          # thousands of tiny files, so `tar -x` is syscall-bound, and `-P` unpacks
          # them onto the runner's root filesystem rather than the optane volume
          # every other cache here lives on.
          #
          # Point the cache at that volume instead and let it persist. It is shared
          # by the whole fleet, so it stays warm no matter which runner picks the
          # job up — strictly better than a per-run tarball, which is cold whenever
          # the key moves (a version bump cost 144s and 164s on the two runs after
          # it).
          GOLANGCI_LINT_CACHE: /mnt/optane/github-actions/harbrr-golangci-cache
        with:
          # Pin the version so it matches the version in `make tools`.
          version: v2.13.0
          only-new-issues: ${{ github.event_name == 'pull_request' }}
          # The cache lives on host disk now; the action's own save/restore would
          # both miss the path above and re-add the tar cost it is meant to avoid.
          skip-cache: true
          skip-save-cache: true

  # gitleaks is the source-of-truth secret scanner; the CLI binary is run directly
  # (pinned by version + SHA-256) because gitleaks/gitleaks-action needs a paid license
  # on org repos. check-no-secrets.sh is a targeted tracker-credential backstop.
  secret-scan:
    name: secret scan
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans full commit history
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: gitleaks scan
        run: ./gitleaks git . --config .gitleaks.toml --redact --exit-code 1
      - name: tracker-secret backstop
        run: scripts/check-no-secrets.sh --all

  # govulncheck reports CVEs on the call paths harbrr actually reaches (low noise); the
  # vulnerability DB is fetched fresh each run.
  govulncheck:
    name: govulncheck
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      GOVULNCHECK_VERSION: v1.7.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Single source of truth (autobrr/qui's pattern): setup-go reads the
          # version straight from go.mod, so a bump there needs no CI edit.
          go-version-file: go.mod
          # Host job on the shared persistent self-hosted fleet: GOMODCACHE/GOCACHE
          # already persist in /root between runs, so a GHA cache round-trip is pure
          # overhead. Container jobs that need caching (backend-test) use actions/cache.
          cache: false
      - name: cache govulncheck
        id: govulncheck-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/govulncheck
          key: govulncheck-${{ runner.os }}-${{ runner.arch }}-${{ env.GOVULNCHECK_VERSION }}
      - name: install govulncheck
        if: steps.govulncheck-cache.outputs.cache-hit != 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
      - name: govulncheck
        run: govulncheck ./...

  # Cross-compile the non-Linux targets on the Linux runner (Go cross-compiles
  # natively — no emulation). Linux binaries are already built by the docker jobs,
  # so keeping them here would duplicate CI work. Depends on the web job only to
  # reuse its dist artifact — every cross-built binary embeds the same tested bundle.
  # Full packaging is the goreleaser job below.
  cross-build:
    # Name is the job key only — the matrix appends "(goos, goarch)", which is the
    # exact required-status-check context on main (e.g. "cross-build (darwin, amd64)").
    # Do not add a custom name: it would change the check name and the branch's
    # required checks would wait forever on a context that no longer reports.
    name: cross-build
    runs-on: self-hosted
    timeout-minutes: 10
    needs: [web]
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      # Full history so `git describe --tags` can stamp the binary version (matches the
      # Makefile's ldflags), the same way `make build` does locally. The job only runs
      # read-only git ops after checkout, so don't persist the token in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Single source of truth (autobrr/qui's pattern): setup-go reads the
          # version straight from go.mod, so a bump there needs no CI edit.
          go-version-file: go.mod
          # Host job on the shared persistent self-hosted fleet: GOMODCACHE/GOCACHE
          # already persist in /root between runs, so a GHA cache round-trip is pure
          # overhead. Container jobs that need caching (backend-test) use actions/cache.
          cache: false
      - name: download web dist (built once by the web job)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist
      - name: guard the bundle
        run: scripts/check-web-dist.sh
      - name: build ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          version="$(scripts/ci-version.sh)"
          commit="$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse --short HEAD)"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath -ldflags "-s -w \
            -X github.com/autobrr/harbrr/internal/version.Version=${version} \
            -X github.com/autobrr/harbrr/internal/version.Commit=${commit} \
            -X github.com/autobrr/harbrr/internal/version.Date=${date}" \
            -o dist/harbrr ./cmd/harbrr

  # Package the container image so a broken Dockerfile fails CI — the Docker path is how
  # *arr apps reach harbrr, so it must not silently rot. Runs in parallel with the Go
  # test/lint jobs (needs only `web`, to reuse its dist artifact): each arch natively
  # cross-compiles its own linux binary (Go, no emulation) and injects it via a `build`
  # build-context, so the Dockerfile's compile stage is replaced — leaving just COPYs +
  # the certs stage, no QEMU toolchain on the critical path. Each arch builds on its own
  # runner with a per-arch GHA cache scope.
  # amd64 loads the image and runs `version` to prove it works. On a same-repo PR or a
  # version tag each arch is pushed to GHCR by digest; docker-merge (gated on test + lint)
  # then assembles the pullable multi-arch manifest.
  docker:
    name: docker (${{ matrix.arch }})
    runs-on: self-hosted
    timeout-minutes: 20
    needs: [web]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, load: true }
          - { arch: arm64, load: false }
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      # Push to GHCR on a same-repo PR (testable before merge), main (develop tag),
      # or a version tag (release, whether that tag arrived via push or a manual
      # dispatch aimed at the tag).
      PUSH: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') || (github.event_name == 'push' && github.ref == 'refs/heads/main') || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/')) }}
    steps:
      # The job pushes to a registry (packages: write) and runs no git operations after
      # checkout, so don't persist the token in the git config (smaller blast radius).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe for the version stamp
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Single source of truth (autobrr/qui's pattern): setup-go reads the
          # version straight from go.mod, so a bump there needs no CI edit.
          go-version-file: go.mod
          # Host job on the shared persistent self-hosted fleet: GOMODCACHE/GOCACHE
          # already persist in /root between runs, so a GHA cache round-trip is pure
          # overhead. Container jobs that need caching (backend-test) use actions/cache.
          cache: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # The image ships the UI: the web job built (and tested) the bundle once; download
      # it so web/dist is embedded at the Go compile (a gitkeep-only dist would serve
      # "frontend not built"), and hard-fail if the artifact is empty. PR images get the
      # UI too — they are pulled for live validation on real stacks.
      - name: download web dist (built once by the web job)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist
      - name: guard the bundle
        run: scripts/check-web-dist.sh

      # Natively cross-compile this arch's linux binary (no QEMU) into the build-context
      # the Dockerfile's `COPY --from=build /out/harbrr` expects — replacing its compile stage.
      - name: build linux/${{ matrix.arch }} binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          BINCTX: ${{ runner.temp }}/binctx-${{ matrix.arch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          rm -rf "$BINCTX"
          mkdir -p "$BINCTX/out"
          version="$(scripts/ci-version.sh)"
          commit="$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse --short HEAD)"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath -ldflags "-s -w \
            -X github.com/autobrr/harbrr/internal/version.Version=${version} \
            -X github.com/autobrr/harbrr/internal/version.Commit=${commit} \
            -X github.com/autobrr/harbrr/internal/version.Date=${date}" \
            -o "$BINCTX/out/harbrr" ./cmd/harbrr

      # Login/metadata come BEFORE the build so the single buildx invocation below can
      # push directly. Metadata runs unconditionally (it needs no registry access) so
      # the labels expression is always defined.
      - name: log in to GHCR
        if: ${{ env.PUSH == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: registry metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      # ONE buildx invocation per arch (this job sits on the run's critical path, and
      # the old build-for-smoke + rebuild-for-push pair cost ~15s of duplicate drive)
      # with up to two exporters: push-by-digest on a publishing run — anonymous,
      # untagged, and harmless until docker-merge's fully-gated manifest references
      # it — plus a local `type=docker` export on amd64 so the smoke run can execute
      # the exact image without pulling it back (the workflow GITHUB_TOKEN is refused
      # on untagged-digest pulls by GHCR, even though it just pushed the blob; a PAT
      # pulls the same digest fine). arm64 builds to cache (or pushes) without a
      # local export — it cannot execute on this host anyway. Empty output lines are
      # filtered by the action, so each exporter line degrades to nothing cleanly.
      - name: build image (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          build-contexts: |
            build=${{ runner.temp }}/binctx-${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: |
            ${{ env.PUSH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || '' }}
            ${{ matrix.load && 'type=docker' || '' }}
          # No buildx GHA cache: in CI the compile runs in the prior `go build` step and is
          # injected via build-contexts, so buildx only COPYs the binary and rebuilds the tiny
          # native certs stage (seconds). type=gha,mode=max re-uploaded those layers for no
          # reuse and was the biggest consumer of the ~10GB repo cache budget.
          provenance: false
      # The smoke gate: prove the image actually starts, by the image ID the local
      # docker export just produced — no tag, no registry round-trip. amd64 only —
      # an arm64 image cannot execute on this host.
      - name: validate image runs
        if: ${{ matrix.arch == 'amd64' }}
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: docker run --rm --entrypoint harbrr "$IMAGEID" version
      - name: export digest
        if: ${{ env.PUSH == 'true' }}
        env:
          DIGEST_DIR: ${{ runner.temp }}/digests-${{ matrix.arch }}
        run: |
          rm -rf "$DIGEST_DIR"
          mkdir -p "$DIGEST_DIR"
          digest="${{ steps.build.outputs.digest }}"
          touch "$DIGEST_DIR/${digest#sha256:}"
      - name: upload digest
        if: ${{ env.PUSH == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests-${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 1
      - name: cleanup local smoke image
        if: ${{ always() && matrix.arch == 'amd64' }}
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          [ -n "$IMAGEID" ] && docker rmi -f "$IMAGEID" 2>/dev/null || true

  # Assemble the multi-arch manifest from the per-arch digests — the pullable publish
  # step. Only runs when the docker job pushed (same-repo PR or tag); it builds nothing,
  # so it is fast. Gated on `test` AND `golangci-lint`: a red test or lint never publishes
  # a pullable tag (the per-arch digests pushed earlier stay unreferenced/harmless until
  # then). The arch builds still run in parallel, so build feedback is immediate; only the
  # publish waits on the gate.
  docker-merge:
    name: docker-merge
    runs-on: self-hosted
    needs: [docker, backend-test, web-checks, web-e2e, golangci-lint]
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: prepare digest dir
        env:
          DIGEST_DIR: ${{ runner.temp }}/digests
        run: |
          rm -rf "$DIGEST_DIR"
          mkdir -p "$DIGEST_DIR"
      - name: download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: registry metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=pr
            type=raw,value=develop,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          # Pre-release versions (0.1.0-alpha) skip `latest` under semver rules, but
          # alpha tags are the only releases harbrr ships — force `latest` on every
          # release-tag publish so `docker pull ghcr.io/autobrr/harbrr:latest` works.
          # Never on PR/main pushes, and pinned to the v* release convention: push
          # events are already tag-filtered to v*, but a workflow_dispatch can aim at
          # ANY tag, and a stray non-release tag must not overwrite `latest`.
          flavor: |
            latest=${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v') }}
      - name: create manifest list and push
        env:
          DIGEST_DIR: ${{ runner.temp }}/digests
        run: |
          cd "$DIGEST_DIR"
          # word-splitting is intentional: expand to `-t tag1 -t tag2 …` + one image
          # ref per digest file (the standard buildx imagetools manifest-merge idiom).
          # IMAGE / DOCKER_METADATA_OUTPUT_JSON come from env, not template interpolation.
          # shellcheck disable=SC2046
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - name: inspect
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"

  # GoReleaser: on a v* tag, build the binaries/archives/checksums and cut the GitHub
  # Release. On any other run (PR / main push) `goreleaser check` just validates
  # .goreleaser.yml — fast, so it doesn't slow PRs. The container image is published by
  # the docker jobs above; GoReleaser builds no image.
  # `goreleaser check` only validates .goreleaser.yml — it compiles nothing and
  # reads no build output, so gating it behind the test suite bought nothing and
  # put a config check on the critical path (it ended the run at t+138s while
  # waiting on golangci-lint). Split out with no `needs` so it starts immediately.
  # The release job below keeps the full gate, which is where it actually matters.
  goreleaser-check:
    name: goreleaser check
    runs-on: self-hosted
    timeout-minutes: 10
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # `check` renders the config's templates, so RELEASE_HEADER must be defined
      # even though nothing is released here.
      - name: define an empty release header
        run: echo "RELEASE_HEADER=" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  # Tag runs only. Every step below was previously guarded by its own
  # `startsWith(github.ref, 'refs/tags/')`; the job-level `if` now carries that
  # once, so the conditionals inside are gone.
  goreleaser:
    name: goreleaser
    runs-on: self-hosted
    timeout-minutes: 20
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [backend-test, web-checks, web-e2e, golangci-lint, web]
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so the changelog can diff against the previous tag
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Single source of truth (autobrr/qui's pattern): setup-go reads the
          # version straight from go.mod, so a bump there needs no CI edit.
          go-version-file: go.mod
          # Host job on the shared persistent self-hosted fleet: GOMODCACHE/GOCACHE
          # already persist in /root between runs, so a GHA cache round-trip is pure
          # overhead. Container jobs that need caching (backend-test) use actions/cache.
          cache: false
      # Release binaries ship the UI: the web job built (and tested) the bundle once —
      # download it before goreleaser compiles, and hard-fail the release if it is
      # empty. Tag runs only — PR/main runs execute `goreleaser check`, which builds
      # nothing.
      - name: download web dist (built once by the web job)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist
      - name: guard the bundle
        run: scripts/check-web-dist.sh
      # Curated highlights for the GitHub Release header: pull the tag's section
      # from CHANGELOG.md into $RELEASE_HEADER, which goreleaser renders via
      # {{ .Env.RELEASE_HEADER }} above the auto feat/fix commit list. Runs on all
      # events (empty on non-tag) so `goreleaser check` always has the var defined.
      - name: assemble release header from CHANGELOG
        run: |
          header="$(scripts/changelog-extract.sh "${GITHUB_REF#refs/tags/}" || true)"
          {
            echo "RELEASE_HEADER<<HARBRR_NOTES_EOF"
            printf '%s\n' "$header"
            echo "HARBRR_NOTES_EOF"
          } >> "$GITHUB_ENV"
      - name: goreleaser
