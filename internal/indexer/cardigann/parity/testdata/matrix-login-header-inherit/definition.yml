---
id: loginheaderinherit
name: loginheaderinherit
description: "Synthetic private tracker whose apikey lives ONLY in search.headers, probed by a GET login."
language: en-US
type: private
encoding: UTF-8
links:
  - https://loginhdr.test/

caps:
  categories:
    "1": Movies

  modes:
    search: [q]

settings:
  - name: apikey
    type: text
    label: API Key

# HHD-shaped GET login: a bare probe with NO login.headers of its own. Jackett
# selects Login.Headers ?? Search.Headers, so the probe must inherit the
# Authorization carrier below — without the fallback it goes out anonymous and
# the tracker answers "API key not accepted".
login:
  path: api/torrents
  method: get
  error:
    - selector: ":root:contains(\"API key not accepted\")"

search:
  headers:
    Authorization: ["Bearer {{ .Config.apikey }}"]
  paths:
    - path: api/torrents
  inputs:
    q: "{{ .Keywords }}"
  rows:
    selector: tr.row
  fields:
    title:
      selector: a.title
    download:
      selector: a.dl
      attribute: href
    size:
      selector: td.size
    seeders:
      selector: td.seeders
    leechers:
      selector: td.leechers
    category:
      text: "1"
