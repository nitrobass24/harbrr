---
id: dateparse_passthrough
name: Dateparse Passthrough Fixture
description: "A dateparse layout mismatch passes the raw value through to FromUnknown, which resolves relative forms."
language: en-US
type: public
encoding: UTF-8
links:
  - https://rowsemantics.invalid/

caps:
  categorymappings:
    - {id: 1, cat: Movies}
  modes:
    search: [q]

search:
  path: /list
  inputs:
    q: "{{ .Keywords }}"
  rows:
    selector: li.item
  fields:
    title:
      selector: span.title
    category:
      text: "1"
    download:
      selector: a.dl
      attribute: href
    size:
      selector: span.size
    seeders:
      selector: span.seeders
    date:
      selector: span.date
      filters:
        - name: dateparse
          args: "yyyy-MM-dd"
