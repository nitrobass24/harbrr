# https://pre-commit.com — set up with: pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # website/package-lock.json is a generated Docusaurus/npm lockfile —
        # legitimately >500KB, not an accidental binary commit.
        exclude: ^website/package-lock\.json$

  - repo: https://github.com/gitleaks/gitleaks
    # Keep in sync with ci.yml's secret-scan GITLEAKS_VERSION (the guards job
    # enforces agreement) — a rule added upstream must fail here, not only in CI.
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    # Keep in sync with the guards job's actionlint pin (ci.yml).
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      # Host shellcheck (brew install shellcheck); actionlint above also runs it
      # on workflow run: blocks when it is on PATH.
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: ^scripts/.*\.sh$
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        types: [go]
        pass_filenames: false

      # golangci-lint fmt, not a standalone gofumpt: the raw binary misses the
      # goimports local-prefix ordering and gofumpt extra settings configured in
      # .golangci.yml, and its version drifts independently of the pinned
      # golangci-lint. One formatter, one config, one pin.
      - id: golangci-lint-fmt
        name: golangci-lint fmt
        entry: golangci-lint fmt
        language: system
        types: [go]
        pass_filenames: false

      - id: no-tracker-secrets
        name: no-tracker-secrets
        entry: scripts/check-no-secrets.sh
        language: system
        pass_filenames: false

      - id: no-vendored-def-edits
        name: no-vendored-def-edits
        entry: scripts/check-vendor-untouched.sh
        language: system
        pass_filenames: false

      # An openapi.yaml edit is a WEB change: api.gen.ts is generated from it, and
      # `make test-openapi` compares method/path sets only, so it passes on a stale
      # one. Mirrors the web job's drift check locally.
      - id: openapi-types-synced
        name: openapi-types-synced
        entry: scripts/check-openapi-types-synced.sh
        language: system
        pass_filenames: false
